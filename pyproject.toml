[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ganymede"
version = "0.1.0"
description = "Distributed compute coordinator for LoRA fine-tuning across volunteer hardware"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "boto3>=1.34",
    "safetensors>=0.4",
    # torch is a coordinator dependency, not an accident: aggregation must read and
    # write bf16 tensors (numpy has no bf16), and the round-close eval is a forward
    # pass on the coordinator. Keeping both on the same tensor library avoids a
    # second dtype story. See docs/02-architecture-v2.md 5.2.
    "torch>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]
# The trainer's own stack. Kept out of the base dependencies so the coordinator
# can be deployed without transformers, peft and datasets -- it never loads a
# base model (scripts/newrun.py derives the adapter manifest from config.json on
# a meta device), and the coordinator box is the one machine in the system that
# should stay small.
trainer = [
    "transformers>=4.45",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
]

[project.scripts]
ganymede-newrun = "scripts.newrun:main"
ganymede-issue-key = "scripts.issue_key:main"
ganymede-calibrate = "ganymede.trainer.calibrate:main"
ganymede-baseline = "ganymede.trainer.baseline:main"
ganymede-worker = "ganymede.worker.loop:main"
ganymede-host = "ganymede.host.agent:main"
ganymede-cache = "ganymede.host.cache:main"
ganymede-status = "scripts.status:main"
ganymede-backup = "scripts.backup:main"
ganymede-restore = "scripts.restore:main"
ganymede-eligibility = "ganymede.coordinator.eligibility:main"

[tool.setuptools.packages.find]
include = ["ganymede*"]

[tool.pytest.ini_options]
# Two roots. `tests_host` is deliberately not under `tests/`, because
# tests/conftest.py imports torch for the coordinator fixtures and the host
# agent's whole delivery story is that it needs nothing outside the standard
# library -- see tests_host/README.md.
testpaths = ["tests", "tests_host"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: needs the network (a HuggingFace config fetch) or is otherwise not fast",
]
